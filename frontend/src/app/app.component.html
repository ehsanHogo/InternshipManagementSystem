<main class="app-page">
  <section class="app-shell" aria-labelledby="application-title">
    <header class="app-header">
      <i class="pi pi-graduation-cap app-icon" aria-hidden="true"></i>
      <h1 id="application-title">سامانه مدیریت کارآموزی دانشجویان</h1>
      <p>نسخه آزمایشی سامانه</p>
    </header>

    <p-card header="وضعیت سامانه">
      <div class="status-content" aria-live="polite">
        @if (loading) {
          <p-progress-spinner
            ariaLabel="در حال بررسی ارتباط با سرور"
            strokeWidth="5"
            [style]="{ width: '2.5rem', height: '2.5rem' }"
          />
          <span>در حال بررسی ارتباط با سرور...</span>
        } @else {
          <p-tag
            [severity]="connected ? 'success' : 'danger'"
            [icon]="connected ? 'pi pi-check-circle' : 'pi pi-times-circle'"
            [value]="connected ? 'ارتباط با سرور برقرار است' : 'ارتباط با سرور برقرار نیست'"
          />

          @if (!connected) {
            <p-button
              label="تلاش دوباره"
              icon="pi pi-refresh"
              severity="secondary"
              size="small"
              (onClick)="checkServer()"
            />
          }
        }
      </div>
    </p-card>
  </section>
</main>
